name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tests
      - name: Validate example and task records
        shell: bash
        run: |
          shopt -s nullglob
          files=(workflow/task.example.json tasks/*.json)
          python3 scripts/validate_task.py "${files[@]}"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build task builder
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
