name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tests
      - name: Validate example and task records
        shell: bash
        run: |
          shopt -s nullglob
          files=(workflow/task.example.json tasks/*.json)
          python3 scripts/validate_task.py "${files[@]}"
